name: Release

# Push a tag like v0.4.0 (matching project(argonaut VERSION ...) in
# CMakeLists.txt) to build the .deb packages and the Windows zip and
# installer (windows.yml) and publish them as a GitHub Release.
#
# A .deb names the libraries it needs as the system it was built on names
# them, and those names differ between releases of Ubuntu and Debian (Qt's
# are libqt6gui6t64 on Ubuntu 24.04 and libqt6gui6 on newer ones). So one
# package is built for each system in the list below, inside that system's
# own image, and named after it: argonaut-files_0.11.1_ubuntu26.04_amd64.deb.
# To support another system, add a line to the list (here and in ci.yml).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  deb:
    name: .deb for ${{ matrix.system }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: ubuntu24.04, image: 'ubuntu:24.04' }
          - { system: ubuntu26.04, image: 'ubuntu:26.04' }
          - { system: debian13, image: 'debian:13' }
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates build-essential cmake ninja-build qt6-base-dev qt6-tools-dev \
            libvterm-dev libarchive-dev libncurses-dev libqscintilla2-qt6-dev dpkg-dev file \
            pkg-config libxcb1-dev

      - uses: actions/checkout@v5

      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's/^project(argonaut VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version" >&2
            exit 1
          fi

      - name: Build the package
        run: |
          cmake --preset package
          cmake --build build/package
          cpack --config build/package/CPackConfig.cmake

      # argonaut-files_0.11.1_amd64.deb -> argonaut-files_0.11.1_ubuntu26.04_amd64.deb
      - name: Name it after the system
        run: |
          mkdir out
          for deb in build/package/*.deb; do
            name=$(basename "$deb" .deb)
            mv "$deb" "out/${name%_*}_${{ matrix.system }}_${name##*_}.deb"
          done
          ls -l out

      # It must install where it was built, with what apt can find there.
      - name: Check that it installs
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y --no-install-recommends ./out/*.deb
          argonaut --version
          QT_QPA_PLATFORM=offscreen argonaut --help > /dev/null
          # Every feature is in it: the terminal panel, Compress / Extract, the terminal interface.
          ldd /usr/bin/argonaut | grep -q libvterm
          ldd /usr/bin/argonaut | grep -q libarchive
          ldd /usr/bin/argonaut | grep -q libqscintilla2_qt6
          ldd /usr/bin/argonaut-tui | grep -q libvterm
          ldd /usr/bin/argonaut-tui | grep -q libncursesw
          # The AppArmor profile its sandbox needs on Ubuntu, with the scripts that load it.
          test -f /etc/apparmor.d/argonaut-files
          dpkg-query --showformat='${Conffiles}\n' --show argonaut-files | grep -q apparmor.d/argonaut-files

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.system }}
          path: out/*.deb
          if-no-files-found: error

  windows:
    uses: ./.github/workflows/windows.yml
    with:
      release: true

  publish:
    needs: [deb, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: out

      # The Windows program as a zip (unpack and run argonaut.exe) and its installer.
      - uses: actions/download-artifact@v4
        with:
          name: argonaut-windows
          path: windows/argonaut
      - uses: actions/download-artifact@v4
        with:
          name: argonaut-windows-setup
          path: windows/setup
      - name: The Windows files
        run: |
          version=${GITHUB_REF_NAME#v}
          (cd windows && zip -qr "../out/argonaut-${version}-windows-x64.zip" argonaut)
          cp windows/setup/*.exe out/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A tag pushed again (e.g. moved to a fixed commit) replaces the
        # packages of its existing release instead of failing.
        run: |
          ls -l out
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* \
              --title "Argonaut ${GITHUB_REF_NAME#v}" --generate-notes
          fi
