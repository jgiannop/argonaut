name: Windows

# The Windows version: does it build there, and what comes of it (a zip and
# an installer to try on a Windows machine). On dev too, so that work done
# for Linux can't break it unnoticed.
# release.yml calls it too (`workflow_call`, release: true) for the files
# of a release; the tests are left out then.
on:
  push:
    branches: [dev, windows-port]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: The compiler's environment
        uses: ilammy/msvc-dev-cmd@v1

      # libarchive, for Compress / Extract: built by vcpkg (which the machine
      # has) and kept between runs, since building it takes minutes.
      - name: Keep vcpkg's built libraries
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-libarchive-x64-windows-v1

      - name: Install libarchive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$PWD\vcpkg-cache"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libarchive[core,bzip2,lzma,lz4,zstd]:x64-windows"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=build: libarchive::vcpkg could not install libarchive"; exit 1 }

      # libvterm, for the terminal panel: no package of it for Windows, so its
      # release's source, checked against the checksum it had when we chose it,
      # and built by our CMakeLists.txt (ARGONAUT_VTERM_SOURCE).
      - name: Get libvterm's source
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://launchpad.net/libvterm/trunk/v0.3/+download/libvterm-0.3.3.tar.gz -OutFile libvterm.tar.gz
          $sum = (Get-FileHash libvterm.tar.gz -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne "09156f43dd2128bd347cbeebe50d9a571d32c64e0cf18d211197946aff7226e0") { Write-Output "::error title=build: libvterm::the download's checksum is $sum"; exit 1 }
          tar -xzf libvterm.tar.gz
          "VTERM_SOURCE=$(($PWD.Path) -replace '\\', '/')/libvterm-0.3.3" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows "-DARGONAUT_VTERM_SOURCE=$env:VTERM_SOURCE" 2>&1 | Tee-Object -FilePath configure.log
          python .github/scripts/errors_as_notes.py configure.log "build: configuring" "CMake Error|Compress / Extract|Embedded terminal"
          if (-not (Select-String -Path configure.log -Pattern "Embedded terminal: enabled" -Quiet)) { Write-Output "::error title=build: terminal::the terminal panel is not in the build"; exit 1 }
          exit 0

      # Everything is built even after an error, so one run shows all there is to fix.
      - name: Build
        shell: pwsh
        run: |
          cmake --build build/windows -- -k 0 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      # The log can't be read without signing in; notes on the run can.
      - name: The errors, as notes
        if: failure()
        run: python .github/scripts/errors_as_notes.py build.log

      - name: Put the program and its Qt libraries together
        shell: cmd
        run: |
          mkdir dist
          copy build\windows\*.exe dist\
          copy build\windows\*.dll dist\
          xcopy /E /I /Y build\windows\extensions dist\extensions
          for %%f in (dist\argonaut-*-extension.exe) do windeployqt --release --no-translations --no-compiler-runtime %%f
          windeployqt --release --no-translations --no-compiler-runtime dist\argonaut.exe

      # Microsoft's C++ runtime (VCRUNTIME140.dll and the others), beside the
      # program: a fresh Windows doesn't have it, and the program won't start.
      - name: Add the C++ runtime
        shell: pwsh
        run: |
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" dist\
          Get-ChildItem dist\*.dll | Where-Object { $_.Name -match "vcruntime|msvcp" } | ForEach-Object { $_.Name }
          if (-not (Test-Path dist\vcruntime140.dll)) { Write-Output "::error title=build: runtime::vcruntime140.dll was not copied"; exit 1 }

      - name: Keep it to try
        uses: actions/upload-artifact@v4
        with:
          name: argonaut-windows
          path: dist

      # The installer: the same folder, with a Start menu entry and an uninstaller.
      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(argonaut VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSource=..\dist" installer\argonaut.iss 2>&1 | Tee-Object -FilePath installer.log
          if ($LASTEXITCODE -ne 0) { python .github/scripts/errors_as_notes.py installer.log "build: installer" "Error|error|line"; exit 1 }
          Get-ChildItem installer-out

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: argonaut-windows-setup
          path: installer-out

      # The tests, where they stand on Windows: built and run to see what there
      # is to do. Nothing here fails the job yet.
      - name: Tests (to see where they stand)
        if: ${{ always() && !inputs.release }}
        continue-on-error: true
        shell: pwsh
        run: |
          cmake -S . -B build/windows-tests -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows "-DARGONAUT_VTERM_SOURCE=$env:VTERM_SOURCE" 2>&1 | Tee-Object -FilePath tests-configure.log
          cmake --build build/windows-tests -- -k 0 2>&1 | Tee-Object -FilePath tests-build.log
          ctest --test-dir build/windows-tests --timeout 300 --output-on-failure 2>&1 | Tee-Object -FilePath tests-run.log
          python .github/scripts/errors_as_notes.py tests-configure.log "build: tests, configuring" "CMake Error|disabled|not found"
          python .github/scripts/errors_as_notes.py tests-build.log "build: tests, compiling"
          python .github/scripts/errors_as_notes.py tests-run.log "build: tests, running" "FAIL!|Loc: |QFATAL|ASSERT|Passed|Failed|Timeout|Not Run|Exception|Totals|tests passed|No tests|0xc0|cannot|not found"
          # One of those that stop at once, run by hand: what it prints and how it ends.
          $env:ARGONAUT_TRASH_HOME_ONLY = "1"; $env:ARGONAUT_KEYSTORE = "file"; $env:QT_DEBUG_PLUGINS = "1"
          foreach ($platform in "offscreen", "windows") {
            $env:QT_QPA_PLATFORM = $platform
            "== tst_contenttype with $platform" | Tee-Object -FilePath tests-few.log -Append
            cmd /c "build\windows-tests\tst_contenttype.exe 2>&1" | Select-Object -Last 25 | Tee-Object -FilePath tests-few.log -Append
            "exit code: $LASTEXITCODE (hex $('{0:x}' -f $LASTEXITCODE))" | Tee-Object -FilePath tests-few.log -Append
          }
          python .github/scripts/errors_as_notes.py tests-few.log "build: tests, one by hand" "."
          exit 0
